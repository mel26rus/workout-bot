services:
  bot:
    build: .
    container_name: workout-bot
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./Logs:/app/Logs
    environment:
      - TZ=Europe/Moscow
    # Postgres стоит на этом же компьютере, в config.yaml он доступен как host.docker.internal
    networks:
      - default
      # сеть с VPN из compose expenseBot: Telegram доступен только через него
      - vpn-network
    restart: unless-stopped

  caddy:
    build: ./caddy
    container_name: workout-caddy
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # на этот порт роутер пробрасывает внешний 7079
    ports:
      - "443:443"
    depends_on:
      - bot
    restart: unless-stopped

networks:
  vpn-network:
    external: true
    name: ${VPN_NETWORK}

volumes:
  caddy_data:
  caddy_config:
