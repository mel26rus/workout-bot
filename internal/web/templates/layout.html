{{define "layout"}}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нутри Таня</title>
<style>
body { font-family: sans-serif; max-width: 960px; margin: 20px auto; padding: 0 10px; }
nav a { margin-right: 16px; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; }
th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
.msg { background: #eef; padding: 6px 10px; }
.warn { background: #fee; color: #900; padding: 6px 10px; }
td.text { white-space: pre-wrap; }
td input[type=number] { width: 70px; }
td select { max-width: 200px; }
label { display: block; margin: 10px 0 2px; }
input[type=text], input[type=number], textarea, select { width: 100%; max-width: 480px; box-sizing: border-box; }
</style>
</head>
<body>
<nav>
<a href="/users">Занимающиеся</a>
<a href="/challenges">Челленджи</a>
<a href="/days">Тренировки</a>
</nav>
{{if .Msg}}<p class="msg">{{.Msg}}</p>{{end}}
{{template "content" .}}
</body>
</html>{{end}}
