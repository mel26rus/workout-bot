{{define "content"}}
<h2>Тренировки</h2>

<h3>Добавить тренировку</h3>
<form method="post" action="/days" enctype="multipart/form-data" id="day-form">
<label for="doc_workout_id">Челлендж</label>
<select id="doc_workout_id" name="doc_workout_id" required>
{{range .Challenges}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
</select>
<label for="day_number">Номер дня</label>
<input type="number" id="day_number" name="day_number" min="1" required>
<label for="description">Описание</label>
<textarea id="description" name="description" rows="6"></textarea>
<label for="file">Файл (до {{.MaxFileMB}} МБ)</label>
<input type="file" id="file" name="file">
<p id="overwrite-warning" class="warn" hidden></p>
<p><button type="submit">Сохранить</button></p>
</form>

<h3>Загруженные тренировки</h3>
<table>
<tr><th>Челлендж</th><th>День</th><th>Описание</th><th>Файл</th></tr>
{{range .Days}}
<tr data-challenge="{{.DocWorkoutID}}" data-day="{{.DayNumber}}">
<td>{{.DocWorkoutName}}</td>
<td>{{.DayNumber}}</td>
<td>{{.Description}}</td>
<td>{{if .FileName}}{{.FileName}} ({{mb .FileSize}}){{else}}—{{end}}</td>
</tr>
{{else}}
<tr><td colspan="4">Тренировок пока нет</td></tr>
{{end}}
</table>

<script>
// Предупреждаем, если тренировка этого дня уже есть и будет перезаписана
(function () {
  var form = document.getElementById('day-form');
  var sel = document.getElementById('doc_workout_id');
  var dayInput = document.getElementById('day_number');
  var fileInput = document.getElementById('file');
  var warning = document.getElementById('overwrite-warning');

  function overwriteText() {
    var day = parseInt(dayInput.value, 10);
    if (!sel.value || isNaN(day)) return '';
    var row = document.querySelector('tr[data-challenge="' + sel.value + '"][data-day="' + day + '"]');
    if (!row) return '';
    var name = sel.options[sel.selectedIndex].text;
    var what = fileInput.files.length > 0
      ? 'Описание и файл будут заменены.'
      : 'Описание будет заменено, прежний файл останется.';
    return 'Тренировка дня ' + day + ' челленджа «' + name + '» уже есть и будет перезаписана. ' + what;
  }

  function update() {
    var text = overwriteText();
    warning.textContent = text;
    warning.hidden = text === '';
  }

  sel.addEventListener('change', update);
  dayInput.addEventListener('input', update);
  fileInput.addEventListener('change', update);
  form.addEventListener('submit', function (e) {
    var text = overwriteText();
    if (text !== '' && !confirm(text + '\n\nПродолжить?')) e.preventDefault();
  });
  update();
})();
</script>
{{end}}
